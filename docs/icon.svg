<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- glass tile: blue → indigo → violet, top-lit -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#46A6FF"/>
      <stop offset="0.45" stop-color="#0A74E8"/>
      <stop offset="1" stop-color="#6A37DE"/>
    </linearGradient>
    <!-- soft top-left sheen on the tile -->
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- sphere volume: bright top-left, deep navy bottom-right (3D) -->
    <radialGradient id="sphere" cx="0.36" cy="0.33" r="0.92">
      <stop offset="0" stop-color="#EAF3FF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#08245E" stop-opacity="0.30"/>
    </radialGradient>
    <!-- warm molten-core glow -->
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7AE" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#FF9E42" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF7A2F" stop-opacity="0"/>
    </radialGradient>
    <!-- molten core fill -->
    <radialGradient id="core" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFF6DA"/>
      <stop offset="0.5" stop-color="#FFC458"/>
      <stop offset="1" stop-color="#FF6F22"/>
    </radialGradient>
  </defs>

  <!-- rounded tile (≈ macOS squircle proportions) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- ── mantle cross-section sphere, centered at (512,512) ── -->
  <!-- volumetric body -->
  <circle cx="512" cy="512" r="254" fill="url(#sphere)"/>
  <!-- soft concentric mantle shells -->
  <circle cx="512" cy="512" r="190" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="512" cy="512" r="132" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- warm core glow rises through the shells -->
  <circle cx="512" cy="512" r="196" fill="url(#coreGlow)"/>
  <!-- crisp crust rim + faint mantle boundary -->
  <circle cx="512" cy="512" r="254" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="12"/>
  <circle cx="512" cy="512" r="190" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
  <!-- molten core + tiny specular -->
  <circle cx="512" cy="512" r="90" fill="url(#core)"/>
  <ellipse cx="488" cy="486" rx="30" ry="22" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-20 488 486)"/>

  <!-- glassy specular sweep across the sphere top-left -->
  <ellipse cx="426" cy="368" rx="158" ry="82" fill="#FFFFFF" fill-opacity="0.17" transform="rotate(-24 426 368)"/>
</svg>
